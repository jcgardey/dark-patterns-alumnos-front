  <div class="main-icon">

  <table class="options-container">
    <tr>
      <th></th>
      <th>Tipos</th>
      <th class="total-detectados">Total detectados</th>
      <th class="color">Color</th>
    </tr>
    <tr class="option">
      <td>
        <label class="switch">
          <input type="checkbox" id="SHAMING">
          <span class="slider round"></span>
        </label>
      </td>
      <td class="tipos">
        <span>Confirm Shaming</span>
      </td>
      <td class="total-detectados">
        <span class="counter" id="ct_SHAMING">0</span>
      </td>
      <td class="color">
        <input type="color" id="color_SHAMING">
      </td>
    </tr>

    <tr class="option">
      <td>
        <label class="switch">
          <input type="checkbox" id="URGENCY">
          <span class="slider round"></span>
        </label>
      </td>
      <td class="tipos">
        <span>Fake Urgency</span>
      </td>
      <td class="total-detectados">
        <span class="counter" id="ct_URGENCY">0</span>
      </td>
      <td class="color">
        <input type="color" id="color_URGENCY">
      </td>
    </tr>

    <tr class="option">
      <td>
        <label class="switch">
          <input type="checkbox" id="SCARCITY">
          <span class="slider round"></span>
        </label>
      </td>
      <td class="tipos">
        <span>Fake Scarcity</span>
      </td>

        <span class="counter" id="ct_SCARCITY">0</span>
      </td>
      <td class="color">
        <input type="color" id="color_SCARCITY">
      </td>
    </tr>

    <tr class="option">
      <td>
        <label class="switch">
          <input type="checkbox" id="HIDDENCOST">
          <span class="slider round"></span>
        </label>
      </td>
      <td class="tipos">
        <span>Hidden cost</span>
      </td>
      <td class="total-detectados">
        <span class="counter" id="ct_HIDDENCOST">0</span>
      </td>
      <td class="color">
        <input type="color" id="color_HIDDENCOST">
      </td>
    </tr>

    <tr class="option">
      <td>
        <label class="switch">
          <input type="checkbox" id="MISDIRECTION">
          <span class="slider round"></span>
        </label>
      </td>

        <span>Misdirection</span>
      </td>

        <span class="counter" id="ct_MISDIRECTION">0</span>
      </td>
      <td class="color">
        <input type="color" id="color_MISDIRECTION">
      </td>
    </tr>

    <tr class="option">
      <td>
        <label class="switch">

          <span class="slider round"></span>
        </label>
      </td>

        <span>Preselection</span>
      </td>

        <span class="counter" id="ct_PRESELECTION">0</span>
      </td>
      <td class="color">
        <input type="color" id="color_PRESELECTION">
      </td>
    </tr>

      </td>
